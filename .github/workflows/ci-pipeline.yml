name: DevOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Run Shell Script Test
      run: |
        chmod +x system_info.sh
        ./system_info.sh

    - name: Validate Dockerfile
      run: |
        docker build -t test-nginx-app .